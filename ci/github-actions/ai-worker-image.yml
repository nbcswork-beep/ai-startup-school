# To enable: copy this file to .github/workflows/ai-worker-image.yml (needs a GitHub login with the
# workflow permission). Kept here because the automation that prepared it lacks that permission.
# Builds the Cloud Run AI worker image with real Docker and checks it. It does not push the image
# anywhere and does not talk to Google Cloud: it proves that the Dockerfile builds and that the
# container starts the way Cloud Run will start it.
name: AI worker image

on:
  push:
    branches: [prep/cloud-run-worker]
    paths:
      - Dockerfile.ai-worker
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.server.json
      - 'server/**'
      - 'api/**'
      - 'bot/**'
      - .github/workflows/ai-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --file Dockerfile.ai-worker --tag ai-worker:ci .

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id ai-worker:ci -u)" != "0"

      - name: Contains only the compiled server, dependencies and package.json
        run: |
          docker run --rm --entrypoint sh ai-worker:ci -c '
            set -e
            test -f server-dist/server/worker/main.js
            test ! -e server && test ! -e src && test ! -e .env
            test ! -e server-dist/server/ai/testing
            ! ls server-dist/server | grep -q "\.test\."
            ! test -e node_modules/typescript
          '

      - name: Refuses to start without configuration (exit 2, names only)
        run: |
          set +e
          docker run --rm -e AI_JOB_ID=not-a-job -e UPSTASH_REDIS_REST_TOKEN=token-that-must-not-be-logged ai-worker:ci > out.log 2>&1
          code=$?
          set -e
          cat out.log
          test "$code" -eq 2
          grep -q '"message":"worker.config_invalid"' out.log
          ! grep -q token-that-must-not-be-logged out.log

      - name: Refuses the session pepper and the Blob token
        run: |
          set +e
          docker run --rm \
            -e AI_JOB_ID=00000000-0000-4000-8000-000000000000 -e AI_WORKER_ENVIRONMENT=preview \
            -e UPSTASH_REDIS_REST_URL=https://redis.invalid -e UPSTASH_REDIS_REST_TOKEN=x \
            -e SESSION_REDIS_PREFIX=aiss:preview:sessions:v1 -e AI_SECRETS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e SESSION_TOKEN_PEPPER=pepper-value -e BLOB_READ_WRITE_TOKEN=vercel_blob_rw_value ai-worker:ci > out.log 2>&1
          code=$?
          set -e
          cat out.log
          test "$code" -eq 2
          grep -q SESSION_TOKEN_PEPPER out.log && grep -q BLOB_READ_WRITE_TOKEN out.log
          ! grep -q pepper-value out.log

      - name: Self-check fails cleanly when Redis is unreachable
        run: |
          set +e
          docker run --rm \
            -e AI_WORKER_SELF_CHECK=1 -e AI_WORKER_ENVIRONMENT=preview \
            -e UPSTASH_REDIS_REST_URL=https://redis.invalid -e UPSTASH_REDIS_REST_TOKEN=x \
            -e SESSION_REDIS_PREFIX=aiss:preview:sessions:v1 -e AI_SECRETS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            ai-worker:ci > out.log 2>&1
          code=$?
          set -e
          cat out.log
          test "$code" -eq 1
          grep -q '"message":"selfcheck.done"' out.log

      - name: Image size
        run: docker image ls ai-worker:ci
